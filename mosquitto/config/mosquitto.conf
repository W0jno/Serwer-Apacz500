# Mosquitto MQTT Broker Configuration

# Basic settings
listener 1883
allow_anonymous true

# WebSocket support
listener 9001
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
connection_messages true
log_timestamp true
