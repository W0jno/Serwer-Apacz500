services:
  # --- 1. Mosquitto (Broker MQTT) ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "0.0.0.0:1883:1883"
      - "0.0.0.0:9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - app-network

  # --- 2. Backend (FastAPI) ---
  fastapi:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-server
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:5000"
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
    volumes:
      - .:/app
      - /app/.venv
      # Ignorujemy folder frontend w kontekście backendu, żeby nie śmiecić
      - /app/frontend
    networks:
      - app-network

  # --- 3. Frontend (React + Vite) ---
  frontend:
    build: ./frontend  # Wskazujemy folder, gdzie jest Dockerfile frontendu
    container_name: react-frontend
    ports:
      - "0.0.0.0:5173:5173"    # Domyślny port Vite
    volumes:
      - ./frontend:/app           # Montujemy kod, aby działał podgląd na żywo
      - /app/node_modules         # ⚠️ WAŻNE: To chroni biblioteki wewnątrz kontenera przed nadpisaniem
    depends_on:
      - fastapi                   # Frontend wystartuje po backendzie
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
